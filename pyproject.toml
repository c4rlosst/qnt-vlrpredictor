[project]
name = "valpredictor"
version = "0.1.0"
description = "Elo-based predictions of Valorant match winners and map scores from vlr.gg data"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "click>=8.1",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
valpredictor = "valpredictor.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valpredictor = ["web/*.html", "storage/*.sql"]
