[project]
name = "cspredictor"
version = "0.1.0"
description = "ML pipeline to predict CS2 match winners and map scores from HLTV data"
requires-python = ">=3.11"
dependencies = [
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "click>=8.1",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cspredictor = "cspredictor.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
