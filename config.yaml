# valpredictor configuration

database:
  path: "data/valpredictor.db"

scraping:
  base_url: "https://www.vlr.gg"
  # randomized delay (seconds) between live requests
  min_delay_seconds: 3.0
  max_delay_seconds: 5.0
  # retry/backoff on 403/429/5xx
  max_retries: 5
  backoff_base_seconds: 10.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  cache_dir: "data/raw/html"
  # respect a hard cap per run so an interrupted/misconfigured job can't hammer the site
  max_requests_per_run: 2000

backfill:
  # default history window (months) when --since is not given
  months_back: 12
  # Only matches whose event name matches `event_include` (and not
  # `event_exclude`) get a full match-page fetch. Filtering on the results
  # list is free, so this keeps the backfill to tier-1 play and an hour or so
  # instead of thousands of tier-2/3 pages. Run `valpredictor scan-events` to
  # see what names exist before tuning these.
  event_include: "Champions Tour|VCT|Valorant Champions|Masters|Esports World Cup|Lock//In"
  event_exclude: "Game Changers|Academy|Showmatch"

features:
  elo:
    initial_rating: 1500.0
    k_factor: 32.0          # per series
    # when a lineup changes, pull that team's Elo this far (per new player,
    # capped) back toward 1500: its past results came from other players
    roster_change_shrink_per_player: 0.10
    roster_change_shrink_cap: 0.50

model:
  # Elo gap -> per-map win chance is fitted with recent matches weighted more: a row this many
  # days older than the newest one gets half the weight (null = all rows equal)
  recency_half_life_days: 90
